<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Lock - Space Environment Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* FPS Counter (Top-Left) */
    #fps-counter {
      position: fixed;
      top: 14px;
      left: 14px;
      color: #0f0;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 0 6px rgba(0, 255, 0, 0.4);
      pointer-events: none;
      z-index: 1000;
      font-family: 'Courier New', monospace;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 0, 0.2);
    }

    /* Simulation Control Panel (Top-Right) */
    #control-panel {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(12, 16, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 14px 18px;
      width: 270px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      color: #e2e8f0;
      font-size: 13px;
      transition: height 0.3s ease;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .control-label {
      font-weight: 500;
      color: #cbd5e1;
    }

    /* Speed Button Group */
    .speed-btn-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .speed-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .speed-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .speed-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    /* Toggle Buttons (Orbit Lines & Pause) */
    .toggle-btn {
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      min-width: 65px;
      text-align: center;
    }

    .toggle-btn.on {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
    }

    .toggle-btn.on:hover {
      background: rgba(16, 185, 129, 0.3);
    }

    .toggle-btn.off {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .toggle-btn.off:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Pause Button */
    .pause-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .pause-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .pause-btn.paused {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .pause-btn.paused:hover {
      background: rgba(245, 158, 11, 0.3);
    }

    /* Satellite Mode Buttons */
    .mode-btn-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-align: center;
    }

    .mode-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .mode-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    /* Manual Mode Section */
    #manual-satellite-section {
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .panel-subheader {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      padding: 8px 6px;
      cursor: grab;
      transition: all 0.2s ease;
    }

    .preview-box:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.2);
    }

    .preview-box:active, .preview-box.dragging {
      cursor: grabbing;
      opacity: 0.7;
    }

    #satellite-preview-canvas {
      width: 140px;
      height: 90px;
      pointer-events: none;
    }

    .drag-hint {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1.5px;
      margin-top: 4px;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>
  <div id="fps-counter">FPS: --</div>

  <!-- Control Panel -->
  <div id="control-panel">
    <div class="panel-header">SIMULATION</div>

    <!-- Speed Row -->
    <div class="control-row">
      <span class="control-label">Speed</span>
      <div class="speed-btn-group" id="speed-group">
        <button class="speed-btn active" data-speed="1" id="speed-1x">1×</button>
        <button class="speed-btn" data-speed="2" id="speed-2x">2×</button>
        <button class="speed-btn" data-speed="4" id="speed-4x">4×</button>
      </div>
    </div>

    <!-- Orbit Lines Row -->
    <div class="control-row">
      <span class="control-label">Orbit Lines</span>
      <button class="toggle-btn on" id="orbit-lines-toggle">ON</button>
    </div>

    <!-- Pause / Resume Row -->
    <div class="control-row">
      <span class="control-label">Pause</span>
      <button class="toggle-btn pause-btn" id="pause-toggle">PAUSE</button>
    </div>

    <!-- Satellite Mode Row -->
    <div class="control-row" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 6px;">
      <span class="control-label">Satellite Mode</span>
      <div class="mode-btn-group" id="mode-group">
        <button class="mode-btn active" id="mode-auto">AUTOMATIC</button>
        <button class="mode-btn" id="mode-manual">MANUAL</button>
      </div>
    </div>

    <!-- Manual Mode Add Satellite Section -->
    <div id="manual-satellite-section">
      <div class="panel-subheader">ADD SATELLITE</div>
      <div id="satellite-preview-container" class="preview-box">
        <canvas id="satellite-preview-canvas" width="140" height="90"></canvas>
        <div class="drag-hint">DRAG ME</div>
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
