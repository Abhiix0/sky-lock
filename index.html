<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Lock - Space Environment Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    #fps-counter {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #0f0;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 0 4px rgba(0, 255, 0, 0.5);
      pointer-events: none;
      z-index: 1000;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div id="fps-counter">FPS: --</div>
  <div id="canvas-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
